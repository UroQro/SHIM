<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIM - Dr. Andrés González</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input, select, button { width: 100%; height: 50px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; padding: 0 15px; }
        .btn-primary { background: #2c3e50; color: white; font-weight: bold; cursor: pointer; border: none; }
        .opt-btn { background: #f8f9fa; cursor: pointer; text-align: center; }
        .opt-btn:hover { background: #3498db; color: white; }
        .progress-bar { background: #eee; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress { background: #3498db; height: 100%; width: 0%; transition: 0.3s; }
        .result-box { margin: 20px 0; padding: 20px; background: #e3f2fd; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="screen-register">
            <h1>Cuestionario SHIM</h1>
            <p style="color: #666; margin-bottom: 10px;">Dr. Andrés González de Rosenzweig</p>
            <input type="text" id="name" placeholder="Nombre completo">
            <input type="number" id="age" placeholder="Edad">
            <select id="state">
                <option value="" disabled selected>Selecciona tu estado</option>
                <option value="Querétaro">Querétaro</option>
                <option value="Nuevo León">Nuevo León</option>
                <option value="CDMX">Ciudad de México</option>
                <option value="Otro">Otro</option>
            </select>
            <button class="btn-primary" onclick="sig()">Comenzar</button>
        </div>

        <div id="screen-quiz" style="display:none;">
            <div class="progress-bar"><div id="progress"></div></div>
            <h3 id="q-text" style="margin-bottom:20px;"></h3>
            <div id="options"></div>
        </div>

        <div id="screen-results" style="display:none;">
            <h2>Tu Resultado</h2>
            <div class="result-box"><h1 id="score">0</h1><p id="diag"></p></div>
            <button class="btn-primary" style="background:#27ae60" onclick="mail()">Enviar al Dr. Andrés</button>
        </div>
    </div>

    <script>
        const qs = [
            {q:"¿Confianza en mantener erección?", a:["Muy baja","Baja","Mod","Alta","Muy alta"]},
            {q:"¿Firmeza para penetración?", a:["Nunca","Pocas veces","A veces","Muchas","Siempre"]},
            {q:"¿Mantuvo después de penetrar?", a:["Nunca","Pocas veces","A veces","Muchas","Siempre"]},
            {q:"¿Dificultad para terminar?", a:["Extrema","Mucha","Difícil","Poco","Nada"]},
            {q:"¿Satisfacción del coito?", a:["Nunca","Pocas veces","A veces","Muchas","Siempre"]}
        ];
        let idx = 0, pts = 0, user = {};

        function sig() {
            user.n = document.getElementById('name').value;
            user.e = document.getElementById('age').value;
            user.s = document.getElementById('state').value;
            if(!user.n || !user.e || !user.s) return alert("Faltan datos");
            
            document.getElementById('screen-register').style.display = 'none';
            document.getElementById('screen-quiz').style.display = 'block';
            loadQ();
        }

        function loadQ() {
            const q = qs[idx];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('progress').style.width = ((idx+1)/5*100)+'%';
            const div = document.getElementById('options');
            div.innerHTML = '';
            q.a.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.innerText = opt;
                b.onclick = () => { pts += (i+1); idx++; if(idx<5) loadQ(); else res(); };
                div.appendChild(b);
            });
        }

        function res() {
            document.getElementById('screen-quiz').style.display = 'none';
            document.getElementById('screen-results').style.display = 'block';
            let d = pts <= 7 ? "Grave" : pts <= 11 ? "Moderada" : pts <= 16 ? "Leve-Mod" : pts <= 21 ? "Leve" : "Normal";
            document.getElementById('score').innerText = pts;
            document.getElementById('diag').innerText = "Disfunción: " + d;
        }

        function mail() {
            const b = `Paciente: ${user.n}%0AEdad: ${user.e}%0APuntaje: ${pts}`;
            window.location.href = `mailto:cuestionarios@uroandres.com?subject=SHIM&body=${b}`;
        }
    </script>
</body>
</html>
