<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIM - Dr. Andrés González</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="app" class="container">
        <section id="screen-register">
            <h1>Cuestionario SHIM</h1>
            <p style="color: #666; margin-bottom: 20px;">Dr. Andrés González de Rosenzweig</p>
            <div class="form-group">
                <input type="text" id="name" placeholder="Nombre completo">
                <input type="number" id="age" placeholder="Edad">
                <select id="state">
                    <option value="" disabled selected>Selecciona tu estado</option>
                    <option value="Querétaro">Querétaro</option><option value="Nuevo León">Nuevo León</option><option value="Aguascalientes">Aguascalientes</option><option value="Baja California">Baja California</option><option value="Baja California Sur">Baja California Sur</option><option value="Campeche">Campeche</option><option value="Chiapas">Chiapas</option><option value="Chihuahua">Chihuahua</option><option value="Ciudad de México">Ciudad de México</option><option value="Coahuila">Coahuila</option><option value="Colima">Colima</option><option value="Durango">Durango</option><option value="Estado de México">Estado de México</option><option value="Guanajuato">Guanajuato</option><option value="Guerrero">Guerrero</option><option value="Hidalgo">Hidalgo</option><option value="Jalisco">Jalisco</option><option value="Michoacán">Michoacán</option><option value="Morelos">Morelos</option><option value="Nayarit">Nayarit</option><option value="Oaxaca">Oaxaca</option><option value="Puebla">Puebla</option><option value="Quintana Roo">Quintana Roo</option><option value="San Luis Potosí">San Luis Potosí</option><option value="Sinaloa">Sinaloa</option><option value="Sonora">Sonora</option><option value="Tabasco">Tabasco</option><option value="Tamaulipas">Tamaulipas</option><option value="Tlaxcala">Tlaxcala</option><option value="Veracruz">Veracruz</option><option value="Yucatán">Yucatán</option><option value="Zacatecas">Zacatecas</option><option value="Otro">Otro</option>
                </select>
                <button type="button" id="btn-start" class="btn-primary">Comenzar Cuestionario</button>
            </div>
        </section>

        <section id="screen-quiz" style="display:none;">
            <div class="progress-bar"><div id="progress"></div></div>
            <h3 id="question-text" style="min-height: 80px;"></h3>
            <div id="options-container"></div>
        </section>

        <section id="screen-results" style="display:none;">
            <h2>Tu Resultado</h2>
            <div class="result-box">
                <h1 id="result-score">0</h1>
                <p id="result-diagnosis"></p>
            </div>
            <button id="btn-email-send" class="btn-success">Enviar resultados a Dr. Andrés</button>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
